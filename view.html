<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="stylesheet" href="css/view.css">
  <script>
    const token = localStorage.getItem('token');
    if (!token) {
      window.location.href = 'login.html';
    }
  </script>
  <meta charset="UTF-8">
  <title>Employee List</title>
  <link rel="icon" href="logo.png" type="image/x-icon">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body>

  <!-- Background Effects -->
  <div class="bubbles">
    <div class="bubble"></div>
    <div class="bubble"></div>
    <div class="bubble"></div>
    <div class="bubble"></div>
    <div class="bubble"></div>
  </div>

  <!-- Search and Filter Bar -->
  <div class="search-filter-bar">
    <button class="filter-btn" id="filterBtn">Filter</button>
    <div class="filter-dropdown" id="filterDropdown">
      <label for="filterRole">Role</label>
      <select id="filterRole">
        <option value="">All</option>
        <option value="Designer">Designer</option>
        <option value="Developer">Developer</option>
        <option value="Technician">Technician</option>
        <option value="Testing">Testing</option>
        <option value="Team Leader">Team Leader</option>
        <option value="Project Manager">Project Manager</option>
      </select>
      <label for="filterGender">Gender</label>
      <select id="filterGender">
        <option value="">All</option>
        <option value="Male">Male</option>
        <option value="Female">Female</option>
        <option value="Other">Other</option>
      </select>
      <div class="filter-actions">
        <button class="filter-action-btn" id="applyFilterBtn">Apply</button>
        <button class="filter-action-btn" id="clearFilterBtn">Clear</button>
      </div>
    </div>
    <input class="search-input" id="searchInput" type="text" placeholder="Search by name..." autocomplete="off"/>
    <button class="logout-btn" onclick="logout()">Logout</button>

  </div>

  <div class="top-header-bar">
    <h2>Employee Management System</h2>
    <button class="back-btn" onclick="goToHome()">Back to Home</button>
  </div>
  <div id="employeeList"></div>
 
<script>
   function goToHome(){
      window.location.href="index.html";
    }
    function logout(){
      localStorage.removeItem('token');
      window.location.href = 'index.html';
    }

  const API_URL = "http://localhost:8080/employees";
  let allEmployees = [];

  // --- Search and Filter UI ---
  const filterBtn = document.getElementById('filterBtn');
  const filterDropdown = document.getElementById('filterDropdown');
  const applyFilterBtn = document.getElementById('applyFilterBtn');
  const clearFilterBtn = document.getElementById('clearFilterBtn');
  const searchInput = document.getElementById('searchInput');

  // Toggle filter dropdown
  filterBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    filterDropdown.style.display = filterDropdown.style.display === 'block' ? 'none' : 'block';
  });
  document.body.addEventListener('click', () => {
    filterDropdown.style.display = 'none';
  });
  filterDropdown.addEventListener('click', (e) => e.stopPropagation());

  // --- Load Employees (with filter) ---
  function loadEmployeesWithFilter() {
    const role = document.getElementById('filterRole').value;
    const gender = document.getElementById('filterGender').value;

    let url = `${API_URL}`;
    const params = new URLSearchParams();
    if (role) params.append('role', encodeURIComponent(role));
    if (gender) params.append('gender', encodeURIComponent(gender));
    if (params.toString()) url += '?' + params.toString();

    fetch(url, {
      headers: {
        "Authorization": "Bearer " + localStorage.getItem('token')
      }
    })
      .then(response => {
        if (!response.ok) {
          console.error('Fetch error:', response.status, response.statusText);
          throw new Error('Network response was not ok');
        }
        return response.json();
      })
      .then(employees => {
        allEmployees = employees;
        renderEmployees(employees);
      })
      .catch(error => {
        console.error('Error loading employees:', error);
        const listDiv = document.getElementById('employeeList');
        listDiv.innerHTML = '<div class="employee"><p>Error loading employees. Check console for details.</p></div>';
      });
  }

  // --- Render Employees (filtered or searched) ---
  function renderEmployees(employees) {
    const listDiv = document.getElementById('employeeList');
    listDiv.innerHTML = '';

    if (employees.length === 0) {
      listDiv.innerHTML = '<div class="employee"><p>No employees found.</p></div>';
    } else {
      employees.forEach((emp, index) => {
        const empDiv = document.createElement('div');
        empDiv.className = 'employee';
        empDiv.innerHTML = `
          <div id="view-${index}">
            <p><strong>ID:</strong> ${emp.id}</p>
            <p><strong>Name:</strong> ${emp.name}</p>
            <p><strong>Email:</strong> ${emp.email}</p>
            <p><strong>Age:</strong> ${emp.age}</p>
            <p><strong>Gender:</strong> ${emp.gender}</p>
            <p><strong>Role:</strong> ${emp.role}</p>
            <button class="btn update-btn" onclick="editEmployee(${index}, ${emp.id})">Update</button>
            <button class="btn delete-btn" onclick="deleteEmployee(${emp.id})">Delete</button>
          </div>
          <div id="edit-${index}" style="display:none;">
            <label>Name: <input type="text" id="edit-name-${index}" value="${emp.name}"></label>
            <label>Email: <input type="email" id="edit-email-${index}" value="${emp.email}"></label>
            <label>Age: <input type="number" id="edit-age-${index}" value="${emp.age}"></label>
            <label>Gender: 
              <select id="edit-gender-${index}">
                <option ${emp.gender === "Male" ? "selected" : ""}>Male</option>
                <option ${emp.gender === "Female" ? "selected" : ""}>Female</option>
                <option ${emp.gender === "Other" ? "selected" : ""}>Other</option>
              </select>
            </label>
            <label>Role:
              <select id="edit-role-${index}">
                <option value="Designer" ${emp.role === "Designer" ? "selected" : ""}>Designer</option>
                <option value="Developer" ${emp.role === "Developer" ? "selected" : ""}>Developer</option>
                <option value="Technician" ${emp.role === "Technician" ? "selected" : ""}>Technician</option>
                <option value="Testing" ${emp.role === "Testing" ? "selected" : ""}>Testing</option>
                <option value="Team Leader" ${emp.role === "Team Leader" ? "selected" : ""}>Team Leader</option>
                <option value="Project Manager" ${emp.role === "Project Manager" ? "selected" : ""}>Project Manager</option> 
                </select>
              </label>
            <button class="btn update-btn" onclick="saveEmployee(${index}, ${emp.id})">Save</button>
            <button class="btn delete-btn" onclick="cancelEdit(${index})">Cancel</button>
          </div>
        `;
        listDiv.appendChild(empDiv);
      });
    }
  }

  // --- Search by Name (frontend, instant) ---
  searchInput.addEventListener('input', function() {
    const searchTerm = this.value.trim().toLowerCase();
    const filtered = allEmployees.filter(emp => emp.name.toLowerCase().includes(searchTerm));
    renderEmployees(filtered);
  });

  // --- Filter Actions ---
  applyFilterBtn.addEventListener('click', function() {
    loadEmployeesWithFilter();
    filterDropdown.style.display = 'none';
    searchInput.value = '';
  });

  clearFilterBtn.addEventListener('click', function() {
    document.getElementById('filterRole').value = '';
    document.getElementById('filterGender').value = '';
    loadEmployeesWithFilter();
    filterDropdown.style.display = 'none';
    searchInput.value = '';
  });

  // --- Edit, Save, Cancel, Delete ---
  window.editEmployee = function(index) {
    document.getElementById(`view-${index}`).style.display = 'none';
    document.getElementById(`edit-${index}`).style.display = 'block';
  }

  window.cancelEdit = function(index) {
    document.getElementById(`edit-${index}`).style.display = 'none';
    document.getElementById(`view-${index}`).style.display = 'block';
  }

  window.saveEmployee = function(index, id) {
    const newName = document.getElementById(`edit-name-${index}`).value.trim();
    const newEmail = document.getElementById(`edit-email-${index}`).value.trim();
    const newAge = parseInt(document.getElementById(`edit-age-${index}`).value.trim());
    const newGender = document.getElementById(`edit-gender-${index}`).value;
    const newRole = document.getElementById(`edit-role-${index}`).value.trim();

    if (newName && newEmail && newAge > 18 && newGender && newRole) {
      fetch(`${API_URL}/${id}`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json', "Authorization": "Bearer " + localStorage.getItem('token') },
        body: JSON.stringify({
          name: newName,
          email: newEmail,
          age: newAge,
          gender: newGender,
          role: newRole
        })
      })
      .then(res => {
        if (!res.ok) throw new Error('Failed to update');
        return res.json();
      })
      .then(() => {
        loadEmployeesWithFilter();
        Swal.fire({
          icon: 'success',
          title: 'Updated Successfully',
          text: 'Employee details have been updated.'
        });
      })
      .catch(() => {
        Swal.fire({
          icon: 'error',
          title: 'Invalid Input',
          text: 'Make sure all fields are valid and age > 18.'
        });
      });
    } else {
      Swal.fire({
        icon: 'error',
        title: 'Invalid Input',
        text: 'Make sure all fields are valid and age > 18.'
      });
    }
  }

  window.deleteEmployee = function(id) {
    Swal.fire({
      title: 'Are you sure?',
      text: 'You won’t be able to revert this!',
      icon: 'warning',
      showCancelButton: true,
      confirmButtonColor: '#3085d6',
      cancelButtonColor: '#d33',
      confirmButtonText: 'Yes, delete it!'
    }).then((result) => {
      if (result.isConfirmed) {
        fetch(`${API_URL}/${id}`, {
          method: 'DELETE',
          headers: {
            "Authorization": "Bearer " + localStorage.getItem('token')
          }
        })
        .then(() => {
          loadEmployeesWithFilter();
          Swal.fire('Deleted!', 'Employee has been deleted.', 'success');
        });
      }
    });
  }

  // --- Initial Load ---
  document.addEventListener('DOMContentLoaded', loadEmployeesWithFilter);
  // Also load on page load (for browsers that don't fire DOMContentLoaded twice)
    loadEmployeesWithFilter();

</script>

</body>
</html>
